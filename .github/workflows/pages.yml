name: Deploy museum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore editable project
        run: |
          unzip -q museum-source.zip -d source
          mkdir -p source/museum-pointcloud/public
          unzip -q museum-assets-1.zip -d source/museum-pointcloud/public
          unzip -q museum-assets-2.zip -d source/museum-pointcloud/public
          unzip -q museum-assets-3.zip -d source/museum-pointcloud/public
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/museum-pointcloud/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source/museum-pointcloud
      - run: pnpm build:pages
        working-directory: source/museum-pointcloud
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/museum-pointcloud/pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
